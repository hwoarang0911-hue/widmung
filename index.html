<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="description" content="음악가 사이의 헌정·추모·오마주를 별자리처럼 탐색하는 인터랙티브 지도">
<title>헌정의 지도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --paper:#F7F7F5;
  --ink:#141414;
  --ink-2:#3E3E3C;
  --mute:#87867F;
  --line:rgba(20,20,20,.13);
  --hair:rgba(20,20,20,.07);
  --glass:rgba(255,255,255,.60);
  --glass-2:rgba(255,255,255,.74);
  --sans:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',system-ui,sans-serif;
  --myeong:'Nanum Myeongjo','Apple SD Gothic Neo',serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.6;touch-action:none}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}

/* ───────── 머리말 ───────── */
.top{position:fixed;top:0;left:0;right:0;padding:18px 20px 0;z-index:9;pointer-events:none;
  display:flex;align-items:flex-start;justify-content:space-between;gap:18px}
.brand{display:flex;flex-direction:column;gap:1px;min-width:0}
.brand h1{margin:0;font-family:var(--myeong);font-weight:800;font-size:22px;letter-spacing:-.02em;line-height:1.2}
.brand span{color:var(--mute);font-size:10.5px;letter-spacing:.06em}

.glass{background:var(--glass);border:1px solid rgba(255,255,255,.8);
  -webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6);
  box-shadow:0 1px 0 rgba(255,255,255,.85) inset, 0 10px 30px rgba(24,24,32,.07)}

.search{position:relative;flex:none;width:208px;pointer-events:auto}
.search input{width:100%;height:34px;padding:0 30px 0 13px;border-radius:17px;
  background:var(--glass);border:1px solid rgba(255,255,255,.8);color:var(--ink);
  -webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6);
  box-shadow:0 1px 0 rgba(255,255,255,.85) inset, 0 10px 30px rgba(24,24,32,.07);
  font-family:var(--sans);font-size:12.5px;outline:none;transition:border-color .25s,box-shadow .25s}
.search input::placeholder{color:var(--mute)}
.search input:focus{border-color:rgba(20,20,20,.3);box-shadow:0 0 0 3px rgba(20,20,20,.06)}
.search .x{position:absolute;right:5px;top:5px;width:24px;height:24px;border:0;border-radius:50%;
  background:transparent;color:var(--mute);cursor:pointer;font-size:14px;line-height:1;display:none}
.search .x.on{display:block}
.results{position:absolute;top:40px;left:0;right:0;border-radius:16px;overflow:hidden;display:none;
  background:var(--glass-2);border:1px solid rgba(255,255,255,.85);
  -webkit-backdrop-filter:blur(24px) saturate(1.6);backdrop-filter:blur(24px) saturate(1.6);
  box-shadow:0 18px 44px rgba(24,24,32,.13)}
.results.on{display:block}
.results button{display:block;width:100%;text-align:left;padding:9px 14px;background:none;border:0;
  color:var(--ink);font-family:var(--sans);font-size:12.5px;cursor:pointer}
.results button+button{border-top:1px solid var(--hair)}
.results button:hover,.results button:focus{background:rgba(20,20,20,.05);outline:none}
.results em{font-style:normal;color:var(--mute);font-size:11px;margin-left:7px}
@media (max-width:560px){.search{width:150px}.brand h1{font-size:19px}}

/* ───────── 해설 카드 ───────── */
.sheet{position:fixed;z-index:8;display:flex;flex-direction:column;overflow:hidden;
  left:14px;right:14px;bottom:14px;height:46vh;
  border-radius:22px;background:var(--glass);border:1px solid rgba(255,255,255,.8);
  -webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6);
  box-shadow:0 1px 0 rgba(255,255,255,.85) inset, 0 -8px 44px rgba(24,24,32,.12);
  transition:transform .55s cubic-bezier(.22,1.3,.36,1),opacity .32s}
.sheet.hide{opacity:0;pointer-events:none;transform:translateY(calc(100% + 22px))}
.sheet.drag{transition:opacity .32s}
@media (min-width:861px){
  .sheet{left:max(20px,calc(50% - 380px));right:max(20px,calc(50% - 380px));bottom:18px}
}
.grab{flex:none;display:flex;justify-content:center;align-items:center;height:20px;
  cursor:ns-resize;touch-action:none}
.grab::before{content:'';width:42px;height:4px;border-radius:2px;background:rgba(20,20,20,.17);
  transition:background .2s,width .2s}
.grab:hover::before,.sheet.drag .grab::before{background:rgba(20,20,20,.34);width:54px}
.sheet header{padding:2px 20px 11px;border-bottom:1px solid var(--hair);flex:none;position:relative}
.sheet header h2{margin:0;font-family:var(--myeong);font-size:21px;font-weight:800;line-height:1.26;
  letter-spacing:-.02em;padding-right:36px}
.sheet header p{margin:3px 0 0;color:var(--mute);font-size:11px;letter-spacing:.03em}
.close{position:absolute;top:-2px;right:14px;width:30px;height:30px;border-radius:50%;
  border:1px solid var(--line);background:rgba(255,255,255,.5);color:var(--ink-2);cursor:pointer;
  font-size:14px;line-height:1;transition:transform .24s cubic-bezier(.34,1.7,.5,1)}
.close:active{transform:scale(.86) rotate(90deg)}
.tally{display:flex;gap:14px;flex-wrap:wrap;padding:8px 20px;border-bottom:1px solid var(--hair);
  flex:none;font-size:11px;color:var(--mute);letter-spacing:.01em}
.tally b{font-family:var(--myeong);font-size:15px;font-weight:800;color:var(--ink);margin-right:4px}
.body{overflow-y:auto;overscroll-behavior:contain;padding:2px 20px 16px;-webkit-overflow-scrolling:touch}
.group{margin-top:15px}
.group h3{margin:0 0 8px;font-size:11.5px;font-weight:600;color:var(--mute);letter-spacing:.03em;
  display:flex;align-items:center;gap:9px}
.group h3::before{content:'';width:20px;height:0;border-top:1.5px solid var(--ink-2);flex:none}
.group.m h3::before{border-top-style:dotted;border-top-width:2px}
.group.h h3::before{border-top-style:dashed}
.group.out h3::before{border-top-color:var(--mute)}
.item{padding:11px 0;border-top:1px solid var(--hair)}
.item:first-of-type{border-top:0}
.item .who{font-size:11.5px;color:var(--mute);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.item .what{font-family:var(--myeong);font-size:16.5px;font-weight:700;line-height:1.42;
  letter-spacing:-.01em;margin:3px 0 2px}
.item .meta{font-size:11px;color:var(--mute);letter-spacing:.01em}
.item .tale{margin:7px 0 0;font-size:13px;line-height:1.68;color:var(--ink-2)}
.badge{font-style:normal;font-size:9.5px;letter-spacing:.08em;color:var(--ink);
  border:1px solid var(--line);border-radius:3px;padding:2px 6px}
.item.lit{background:rgba(20,20,20,.05);border-radius:12px;padding:11px 13px;margin:0 -13px}
.item .links{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
.item a{font-size:11.5px;text-decoration:none;color:var(--ink-2);border:1px solid var(--line);
  border-radius:14px;padding:4px 12px;transition:background .2s,color .2s,border-color .2s}
.item a:hover{background:var(--ink);border-color:var(--ink);color:#fff}
.jump{background:none;border:0;color:var(--mute);font:inherit;cursor:pointer;padding:0;
  border-bottom:1px solid var(--line)}
.jump:hover{color:var(--ink);border-color:var(--ink)}

/* ───────── 조작 ───────── */
.tools{position:fixed;left:20px;bottom:calc(20px + var(--sheetH,0px));z-index:7;display:flex;gap:8px;
  align-items:center;transition:bottom .5s cubic-bezier(.22,1.3,.36,1),opacity .3s}
.sheet.drag~.tools{transition:opacity .3s}
.tools.dim{opacity:0;pointer-events:none}
.tool{width:40px;height:40px;border-radius:50%;cursor:pointer;color:var(--ink);font-size:15px;
  background:var(--glass);border:1px solid rgba(255,255,255,.8);
  -webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6);
  box-shadow:0 1px 0 rgba(255,255,255,.85) inset, 0 10px 30px rgba(24,24,32,.07);
  display:grid;place-items:center;transition:transform .24s cubic-bezier(.34,1.75,.5,1)}
.tool:active{transform:scale(.85)}
.tool.wide{width:auto;padding:0 16px;border-radius:20px;font-size:12.5px;font-family:var(--sans)}
@media (max-width:560px){.tools{left:14px}}
.hint{position:fixed;left:0;right:0;bottom:26px;text-align:center;color:var(--mute);font-size:11px;
  letter-spacing:.02em;z-index:5;pointer-events:none;transition:opacity .6s}
.hint.gone{opacity:0}
.toast{position:fixed;left:50%;transform:translate(-50%,14px) scale(.97);top:92px;z-index:9;
  width:min(430px,calc(100% - 28px));display:none;align-items:center;gap:12px;
  padding:12px 12px 12px 17px;border-radius:18px;color:var(--ink-2);font-size:12.5px;line-height:1.5;
  background:var(--glass-2);border:1px solid rgba(255,255,255,.85);
  -webkit-backdrop-filter:blur(24px) saturate(1.6);backdrop-filter:blur(24px) saturate(1.6);
  box-shadow:0 20px 44px rgba(24,24,32,.16);opacity:0;
  transition:opacity .35s,transform .45s cubic-bezier(.22,1.4,.36,1)}
.toast.on{display:flex;opacity:1;transform:translate(-50%,0) scale(1)}
.toast button{flex:none;border:1px solid var(--line);background:none;color:var(--ink);
  font-family:var(--sans);font-size:12px;border-radius:13px;padding:6px 12px;cursor:pointer}
:focus-visible{outline:1.5px solid var(--ink);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms !important}}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div class="top">
  <div class="brand"><h1>헌정의 지도</h1><span id="count"></span></div>
  <div class="search">
    <input id="q" type="search" placeholder="음악가 이름으로 찾기" autocomplete="off" spellcheck="false">
    <button class="x" id="qx" aria-label="지우기">✕</button>
    <div class="results" id="res"></div>
  </div>
</div>

<div class="sheet hide" id="sheet">
  <div class="grab" id="grab" role="separator" aria-label="카드 높이 조절"></div>
  <header>
    <h2 id="sName">—</h2>
    <p id="sSub"></p>
    <button class="close" id="sClose" aria-label="닫기">✕</button>
  </header>
  <div class="tally" id="sTally"></div>
  <div class="body" id="sBody"></div>
</div>

<div class="tools">
  <button class="tool" id="zin" aria-label="확대">＋</button>
  <button class="tool" id="zout" aria-label="축소">－</button>
  <button class="tool wide" id="reset">전체 보기</button>
</div>
<div class="toast" id="toast">
  <span>미리보기 창에서는 외부 초상 이미지를 불러올 수 없습니다. 파일을 내려받아 브라우저에서 열면 실제 초상이 나타납니다.</span>
  <button id="retry">다시 시도</button>
</div>
<p class="hint" id="hint">얼굴을 누르면 헌정 기록이 열립니다 · 선 위의 빛나는 점은 널리 알려진 곡입니다</p>

/* ── 그래프 만들기 ── */
const nodes = D.artists.map(a=>({
  id:a.id, ko:a.ko, name:a.name, short:a.short||a.ko,
  x:0,y:0,vx:0,vy:0,inD:0,outD:0,r:5,
  k:{dedication:0,memorial:0,homage:0}, inRel:[], outRel:[], nb:new Set()
}));
const byId = new Map(nodes.map(n=>[n.id,n]));
const links = [];
for(const r of D.relations){
  const w = workById.get(r.work); if(!w) continue;
  const s = byId.get(w.from), t = byId.get(r.to);
  if(!s || !t) continue;
  const L = {s,t,kind:r.kind,rel:r,work:w,off:0, fame: FAMOUS.has(w.id)||!!w.video};
  links.push(L);
  if(L.fame){ s.fame=true; t.fame=true; }
  t.inD++; s.outD++; t.k[r.kind]=(t.k[r.kind]||0)+1;
  t.inRel.push(L); s.outRel.push(L);
  if(s!==t){ s.nb.add(t); t.nb.add(s); }
}
// 같은 쌍이 여러 번이면 곡선을 서로 어긋나게
const pairSeen = new Map();
for(const L of links){
  const key = L.s.id<L.t.id ? L.s.id+'-'+L.t.id : L.t.id+'-'+L.s.id;
  const n = (pairSeen.get(key)||0); pairSeen.set(key,n+1);
  L.off = (n%2? -1:1) * Math.ceil(n/2) * 13;
}
for(const n of nodes) n.r = 3.6 + Math.sqrt(n.inD)*3.5 + Math.min(n.outD,8)*0.22;
// 연결이 가장 많은 음악가를 지도 한가운데에 고정
let hub = nodes[0];
for(const n of nodes) if(n.inD+n.outD > hub.inD+hub.outD) hub = n;
hub.pin = true;
document.getElementById('count').textContent =
  '음악가 ' + nodes.length + '명 · 연결 ' + links.length + '개';

/* ── 초기 배치: 받은 헌정이 많을수록 안쪽 ── */
const sorted = nodes.slice().sort((a,b)=>b.inD-a.inD);
let seed = 7;
const rnd = ()=> (seed = (seed*1103515245+12345)&0x7fffffff)/0x7fffffff;
let ri = 0;
sorted.forEach(n=>{
  if(n.pin){ n.x=0; n.y=0; return; }
  const ring = 96 + Math.sqrt(ri)*76;
  const ang = ri*2.399963 + rnd()*0.5;
  n.x = Math.cos(ang)*ring; n.y = Math.sin(ang)*ring; ri++;
});

/* ── 힘 시뮬레이션 ── */
let alpha = 1;
function tick(a){
  const N = nodes.length;
  for(let i=0;i<N;i++){
    const p = nodes[i];
    for(let j=i+1;j<N;j++){
      const q = nodes[j];
      let dx=q.x-p.x, dy=q.y-p.y, d2=dx*dx+dy*dy;
      if(d2 < 0.01){ dx=rnd()-.5; dy=rnd()-.5; d2=dx*dx+dy*dy+.01; }
      if(d2 > 620*620) continue;
      const d = Math.sqrt(d2);
      const f = (620*(p.r+q.r)) / d2 * a;
      const fx = dx/d*f, fy = dy/d*f;
      p.vx-=fx; p.vy-=fy; q.vx+=fx; q.vy+=fy;
    }
  }
  for(const L of links){
    if(L.s===L.t) continue;
    const dx=L.t.x-L.s.x, dy=L.t.y-L.s.y;
    const d=Math.hypot(dx,dy)||1;
    const rest = 74 + L.s.r + L.t.r;
    const f = (d-rest)*0.055*a;
    const fx=dx/d*f, fy=dy/d*f;
    L.s.vx+=fx; L.s.vy+=fy; L.t.vx-=fx; L.t.vy-=fy;
  }
  for(const n of nodes){
    n.vx -= n.x*0.0022*a; n.vy -= n.y*0.0022*a;
    if(n.pin){ n.x=0; n.y=0; n.vx=0; n.vy=0; continue; }
    if(n.held){ n.vx=0; n.vy=0; continue; }
    n.vx*=0.80; n.vy*=0.80;
    n.x+=n.vx; n.y+=n.vy;
  }
}
for(let i=0;i<300;i++) tick(Math.max(0.12, 1-i/300));
alpha = 0.06;

const IMG = new Map();          // artistId -> HTMLImageElement | 'no'
let portraitOK = 0;
function enName(n){
  const t = n.name.split(',');
  return (t[1] ? t[1].trim()+' ' : '') + t[0].trim();
}
function loadPortraits(){
  const want = PORTRAIT_IDS.map(id=>byId.get(id)).filter(Boolean);
  for(let i=0;i<want.length;i+=20){
    const batch = want.slice(i,i+20);
    const titles = batch.map(enName).join('|');
    const url = 'https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*'
      + '&prop=pageimages&piprop=thumbnail&pithumbsize=220&redirects=1&titles='
      + encodeURIComponent(titles);
    fetch(url).then(r=>r.json()).then(j=>{
      const pages = (j.query && j.query.pages) || {};
      const found = new Map();
      for(const k in pages){
        const pg = pages[k];
        if(pg.thumbnail && pg.thumbnail.source) found.set(pg.title.toLowerCase(), pg.thumbnail.source);
      }
      const norm = new Map();
      ((j.query&&j.query.normalized)||[]).forEach(r=>norm.set(r.from.toLowerCase(), r.to.toLowerCase()));
      ((j.query&&j.query.redirects)||[]).forEach(r=>norm.set(r.from.toLowerCase(), r.to.toLowerCase()));
      for(const n of batch){
        let key = enName(n).toLowerCase();
        for(let h=0;h<3 && norm.has(key);h++) key = norm.get(key);
        const src = found.get(key);
        if(!src){ IMG.set(n.id,'no'); continue; }
        const im = new Image();
        im.referrerPolicy = 'no-referrer';
        im.onload = ()=>{ im.ready = true; portraitOK++; hideToast(); };
        im.onerror = ()=> IMG.set(n.id,'no');
        im.src = src;
        IMG.set(n.id, im);
      }
    }).catch(()=>{ batch.forEach(n=>IMG.set(n.id,'no')); });
  }
  setTimeout(()=>{ if(!portraitOK) showToast(); }, 5000);
}
function showToast(){ document.getElementById('toast').classList.add('on'); }
function hideToast(){ document.getElementById('toast').classList.remove('on'); }
loadPortraits();

/* ── 카메라(스프링) ── */
const cam = {x:0,y:0,k:1, tx:0,ty:0,tk:1, vx:0,vy:0,vk:0, mode:'free'};
let bounds = {minX:0,maxX:0,minY:0,maxY:0};
function measure(){
  let a=1e9,b=-1e9,c=1e9,d=-1e9;
  for(const n of nodes){ a=Math.min(a,n.x);b=Math.max(b,n.x);c=Math.min(c,n.y);d=Math.max(d,n.y); }
  bounds={minX:a,maxX:b,minY:c,maxY:d};
}
measure();
let K_MIN = .25, K_MAX = 4.2;

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W=0,H=0,DPR=1, panelW=0;
function resize(){
  DPR = Math.min(devicePixelRatio||1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W*DPR; cv.height = H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  panelW = 0;
  if(!sheet.classList.contains('hide')) setSheetH(sheetH, false);
  K_MIN = Math.min(.25, fitScale()*0.55);
}
function openH(){ return sheet.classList.contains('hide') ? 0 : sheetH; }
function viewCX(){ return W/2; }
function viewCY(){ return Math.max(H*0.09, (H - openH())/2); }
function fitScale(){
  const w = bounds.maxX-bounds.minX+130, h = bounds.maxY-bounds.minY+130;
  return Math.min((W-40)/w, (H-openH()-140)/h);
}
function toScreen(n){ return [ (n.x-cam.x)*cam.k + viewCX(), (n.y-cam.y)*cam.k + viewCY() ]; }
function toWorld(sx,sy){ return [ (sx-viewCX())/cam.k + cam.x, (sy-viewCY())/cam.k + cam.y ]; }

function flyTo(x,y,k){
  cam.mode='spring'; cam.tx=x; cam.ty=y; cam.tk=clampK(k);
}
function clampK(k){ return Math.max(K_MIN, Math.min(K_MAX,k)); }
function fitAll(){
  const cx=(bounds.minX+bounds.maxX)/2, cy=(bounds.minY+bounds.maxY)/2;
  flyTo(cx,cy, fitScale()*0.94);
}

let sel = null, hov = null, hovBead = null, query='', matches=new Set();
const on = {dedication:true, memorial:true, homage:true};

/* ── 입력 ── */
const pts = new Map();
let drag=null, pinch=null, moved=0, downAt=0, anchor=null, anchorT=0;

cv.addEventListener('pointerdown', e=>{
  cv.setPointerCapture(e.pointerId);
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  hideHint();
  if(pts.size===2){
    const [a,b]=[...pts.values()];
    pinch={d:Math.hypot(a.x-b.x,a.y-b.y), k:cam.k,
      mx:(a.x+b.x)/2, my:(a.y+b.y)/2};
    pinch.w = toWorld(pinch.mx,pinch.my);
    drag=null; return;
  }
  moved=0; downAt=performance.now();
  const n = pick(e.clientX,e.clientY);
  cam.mode='free'; cam.vx=cam.vy=0;
  drag = n ? {node:n, lx:e.clientX, ly:e.clientY}
           : {lx:e.clientX, ly:e.clientY};
  if(n){ n.held=true; alpha=Math.max(alpha,.28); }
});
cv.addEventListener('pointermove', e=>{
  const p = pts.get(e.pointerId);
  if(p){ p.x=e.clientX; p.y=e.clientY; }
  if(pinch && pts.size>=2){
    const [a,b]=[...pts.values()];
    const d = Math.hypot(a.x-b.x,a.y-b.y);
    let k = pinch.k * (d/pinch.d);
    k = rubber(k);
    cam.k = k; cam.tk = clampK(k);
    const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
    cam.x = pinch.w[0] - (mx-viewCX())/cam.k;
    cam.y = pinch.w[1] - (my-viewCY())/cam.k;
    return;
  }
  if(!drag){
    const n=pick(e.clientX,e.clientY);
    const b=n?null:pickBead(e.clientX,e.clientY);
    if(n!==hov||b!==hovBead){ hov=n; hovBead=b; cv.style.cursor=(n||b)?'pointer':'grab'; }
    return;
  }
  const dx = e.clientX-drag.lx, dy = e.clientY-drag.ly;
  drag.lx=e.clientX; drag.ly=e.clientY;
  moved += Math.abs(dx)+Math.abs(dy);
  if(drag.node){
    drag.node.x += dx/cam.k; drag.node.y += dy/cam.k;
    alpha = Math.max(alpha,.3);
  }else{
    cam.x -= dx/cam.k; cam.y -= dy/cam.k;
    cam.vx = -dx/cam.k*60/16; cam.vy = -dy/cam.k*60/16;
  }
});
function release(e){
  const wasPinch = pts.size>=2;
  pts.delete(e.pointerId);
  if(wasPinch && pts.size<2){ pinch=null; cam.tk=clampK(cam.k); cam.mode='free'; }
  if(!drag) return;
  const d = drag; drag=null;
  if(d.node){ d.node.held=false; alpha=Math.max(alpha,.25); }
  if(moved<9 && performance.now()-downAt<420){
    const n = pick(e.clientX,e.clientY);
    if(n){ select(n); }
    else {
      const b = pickBead(e.clientX,e.clientY);
      if(b) select(b.t, b.rel.id);
      else if(!d.node) select(null);
    }
  }
}
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);

cv.addEventListener('wheel', e=>{
  e.preventDefault(); hideHint();
  anchor = toWorld(e.clientX,e.clientY); anchorT=performance.now();
  anchor.push(e.clientX,e.clientY);
  const f = Math.exp(-e.deltaY*0.0016);
  cam.tk = clampK(cam.tk*f);
  cam.mode='free';
},{passive:false});

cv.addEventListener('dblclick', e=>{
  const n = pick(e.clientX,e.clientY);
  if(n) select(n); else flyTo(...toWorld(e.clientX,e.clientY), cam.k*1.9);
});

function rubber(k){
  if(k>K_MAX) return K_MAX + (k-K_MAX)*0.28;
  if(k<K_MIN) return K_MIN - (K_MIN-k)*0.28;
  return k;
}
function pickBead(sx,sy){
  let best=null, bd=1e9;
  for(const L of links){
    if(L._bx==null) continue;
    const d=Math.hypot(L._bx-sx, L._by-sy);
    if(d<15 && d<bd){ bd=d; best=L; }
  }
  return best;
}
function pick(sx,sy){
  let best=null, bd=1e9;
  for(const n of nodes){
    const [x,y]=toScreen(n);
    const d = Math.hypot(x-sx,y-sy);
    const hit = Math.max(n.r*cam.k+9, 15);
    if(d<hit && d<bd){ bd=d; best=n; }
  }
  return best;
}

/* ── 선택 & 패널 ── */
const sheet=document.getElementById('sheet');
const tools=document.querySelector('.tools');
let sheetH = 0;
function stops(){ return [Math.round(H*0.32), Math.round(H*0.46), Math.round(H*0.88)]; }
function setSheetH(px, animate){
  const st = stops();
  sheetH = Math.max(st[0]*0.7, Math.min(st[2], px));
  sheet.style.height = sheetH+'px';
  document.documentElement.style.setProperty('--sheetH', (sheet.classList.contains('hide')?0:sheetH)+'px');
  tools.classList.toggle('dim', !sheet.classList.contains('hide') && sheetH > H*0.6);
}
function snap(px){
  const st = stops();
  let best = st[0], d = Infinity;
  for(const v of st){ const q = Math.abs(v-px); if(q<d){ d=q; best=v; } }
  return best;
}

/* 손잡이 드래그 — 카드를 위아래로 늘였다 줄임 */
const grab = document.getElementById('grab');
let gdrag = null;
grab.addEventListener('pointerdown', e=>{
  gdrag = {y:e.clientY, h:sheetH};
  grab.setPointerCapture(e.pointerId);
  sheet.classList.add('drag');
  e.preventDefault();
});
grab.addEventListener('pointermove', e=>{
  if(!gdrag) return;
  setSheetH(gdrag.h + (gdrag.y - e.clientY), false);
});
function endGrab(e){
  if(!gdrag) return;
  gdrag = null;
  sheet.classList.remove('drag');
  if(sheetH < H*0.22){ select(null); return; }
  sheet.style.transition = 'height .38s cubic-bezier(.22,1.3,.36,1), transform .55s cubic-bezier(.22,1.3,.36,1), opacity .32s';
  setSheetH(snap(sheetH), true);
  setTimeout(()=>{ sheet.style.transition=''; }, 420);
}
grab.addEventListener('pointerup', endGrab);
grab.addEventListener('pointercancel', endGrab);

function select(n, focusRel){
  sel = n;
  if(!n){
    sheet.classList.add('hide');
    document.documentElement.style.setProperty('--sheetH','0px');
    tools.classList.remove('dim');
    resize(); return;
  }
  buildPanel(n, focusRel);
  const reopening = sheet.classList.contains('hide');
  sheet.classList.remove('hide');
  if(reopening || !sheetH) setSheetH(stops()[1], false);
  else setSheetH(sheetH, false);
  hideHint();
  resize();
  const tk = Math.max(cam.k, 1.15);
  flyTo(n.x, n.y, tk);
  alpha = Math.max(alpha,.16);
}
document.getElementById('sClose').onclick = ()=> select(null);

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function workTitle(w){ return w.ko ? w.ko : w.title; }
function jo(name){ // 이/가
  const ch = name.charCodeAt(name.length-1);
  if(ch<0xAC00||ch>0xD7A3) return name+'가';
  return name + (((ch-0xAC00)%28) ? '이' : '가');
}
function storyOf(L){
  const k1 = L.work.id+':'+L.t.id;
  if(STORY[k1]) return STORY[k1];
  if(STORY[L.work.id]) return STORY[L.work.id];
  let s = jo(L.s.short)+' '+L.t.short+'에게 바친 '+KIND[L.kind].ko+'곡';
  if(L.rel.scope) s += ' · '+L.rel.scope;
  s += '.';
  if(L.rel.note) s += ' '+L.rel.note;
  return s;
}
function ytOf(L){
  const w=L.work;
  if(w.video) return {u:'https://www.youtube.com/watch?v='+w.video, t:(w.videoLabel||'연주 영상'), exact:true};
  const q = (L.rel.query && L.rel.query.trim()) || (L.s.name.split(',')[0].trim()+' '+w.title);
  return {u:'https://www.youtube.com/results?search_query='+encodeURIComponent(q), t:'연주 영상 찾기', exact:false};
}
function itemHTML(L, dir){
  const w=L.work;
  const other = dir==='in' ? L.s : L.t;
  const label = dir==='in' ? '작곡 '+other.ko : '받은 이 '+other.ko;
  const v = ytOf(L);
  let h = '<div class="item'+(L.fame?' fame':'')+'" data-rel="'+L.rel.id+'">';
  h += '<div class="who"><button class="jump" data-go="'+other.id+'">'+esc(label)+'</button>'
     + (FAMOUS.has(w.id)?'<i class="badge">대표곡</i>':'') + '</div>';
  h += '<div class="what">'+esc(workTitle(w))+'</div>';
  if(w.ko && w.title!==w.ko) h += '<div class="meta">'+esc(w.title)+'</div>';
  h += '<p class="tale">'+esc(storyOf(L))+'</p>';
  const links=['<a class="v'+(v.exact?' ex':'')+'" href="'+esc(v.u)+'" target="_blank" rel="noopener">'+esc(v.t)+'</a>'];
  if(w.source) links.push('<a href="'+esc(w.source)+'" target="_blank" rel="noopener">악보·자료</a>');
  h += '<div class="links">'+links.join('')+'</div>';
  return h+'</div>';
}
function buildPanel(n, focusRel){
  document.getElementById('sName').textContent = n.ko;
  document.getElementById('sSub').textContent = n.name;
  const t=[];
  for(const k of ['dedication','memorial','homage']){
    if(n.k[k]) t.push('<span class="'+k[0]+'"><b>'+n.k[k]+'</b>'+KIND[k].ko+' 받음</span>');
  }
  if(n.outD) t.push('<span><b>'+n.outD+'</b>바침</span>');
  document.getElementById('sTally').innerHTML = t.join('') || '<span>기록된 헌정이 없습니다</span>';

  const rank = a => (FAMOUS.has(a.work.id)?0:a.work.video?1:2);
  let h='';
  for(const k of ['dedication','memorial','homage']){
    const rows = n.inRel.filter(L=>L.kind===k).sort((a,b)=>rank(a)-rank(b));
    if(!rows.length) continue;
    const cls = k==='memorial'?' m':k==='homage'?' h':'';
    h += '<section class="group'+cls+'"><h3>'+esc(n.short)+'에게 바친 '+KIND[k].ko+' '+rows.length+'곡</h3>'
      + rows.map(L=>itemHTML(L,'in')).join('') + '</section>';
  }
  if(n.outRel.length){
    const rows = n.outRel.slice().sort((a,b)=>rank(a)-rank(b));
    h += '<section class="group out"><h3>'+esc(n.short)+'가 바친 '+rows.length+'곡</h3>'
      + rows.map(L=>itemHTML(L,'out')).join('') + '</section>';
  }
  if(!h) h = '<p style="color:var(--muted);margin-top:18px">이 음악가와 이어진 기록이 아직 없습니다.</p>';
  const body=document.getElementById('sBody');
  body.innerHTML=h; body.scrollTop=0;
  body.querySelectorAll('[data-go]').forEach(b=>{
    b.onclick=()=>{ const t=byId.get(+b.dataset.go); if(t) select(t); };
  });
  if(focusRel!=null){
    const el = body.querySelector('[data-rel="'+focusRel+'"]');
    if(el){
      el.classList.add('lit');
      requestAnimationFrame(()=>el.scrollIntoView({block:'center',behavior:'smooth'}));
    }
  }
}

/* ── 검색 ── */
const q=document.getElementById('q'), res=document.getElementById('res'), qx=document.getElementById('qx');
function runSearch(){
  query = q.value.trim().toLowerCase();
  qx.classList.toggle('on', !!query);
  matches = new Set();
  if(!query){ res.classList.remove('on'); res.innerHTML=''; return; }
  const hits = nodes.filter(n =>
    n.ko.toLowerCase().includes(query) || n.name.toLowerCase().includes(query) || n.short.toLowerCase().includes(query)
  ).sort((a,b)=>b.inD-a.inD);
  hits.forEach(n=>matches.add(n));
  res.innerHTML = hits.slice(0,6).map(n=>
    '<button data-id="'+n.id+'">'+esc(n.ko)+'<em>'+esc(n.name)+'</em></button>').join('')
    || '<button disabled style="color:var(--muted)">찾는 이름이 없습니다</button>';
  res.classList.add('on');
  res.querySelectorAll('[data-id]').forEach(b=>{
    b.onclick=()=>{ const n=byId.get(+b.dataset.id); res.classList.remove('on'); q.blur(); select(n); };
  });
}
q.addEventListener('input', runSearch);
q.addEventListener('keydown', e=>{
  if(e.key==='Enter'){ const f=res.querySelector('[data-id]'); if(f) f.click(); }
  if(e.key==='Escape'){ q.value=''; runSearch(); q.blur(); }
});
qx.onclick=()=>{ q.value=''; runSearch(); q.focus(); };
document.addEventListener('pointerdown', e=>{
  if(!res.contains(e.target) && e.target!==q) res.classList.remove('on');
}, true);

/* ── 버튼 ── */
document.getElementById('zin').onclick = ()=>{ cam.tk=clampK(cam.tk*1.55); cam.mode = cam.mode==='spring'?'spring':'free'; };
document.getElementById('zout').onclick= ()=>{ cam.tk=clampK(cam.tk/1.55); };
document.getElementById('reset').onclick=()=>{ select(null); setTimeout(()=>{measure();fitAll();},20); };
document.getElementById('retry').onclick=()=>{ hideToast(); IMG.clear(); portraitOK=0; loadPortraits(); };
var hintEl=document.getElementById('hint');
var hinted=false;
function hideHint(){ if(!hinted && hintEl){ hinted=true; hintEl.classList.add('gone'); } }
setTimeout(hideHint, 9000);

/* ── 루프 ── */
let last=performance.now();
function frame(now){
  let dt = Math.min((now-last)/1000, 0.05); last=now;
  if(RM) dt = Math.min(dt,1/60);

  // 물리
  const a = RM ? 0 : alpha;
  if(a>0.001){ tick(a); alpha = Math.max(0.045, alpha*0.988); }
  if(Math.random()<0.02) measure();

  // 카메라 스프링
  if(cam.mode==='spring'){
    sp(cam,'x','tx','vx',dt,120,17);
    sp(cam,'y','ty','vy',dt,120,17);
    sp(cam,'k','tk','vk',dt,150,19);
    if(Math.abs(cam.x-cam.tx)<.4 && Math.abs(cam.y-cam.ty)<.4 && Math.abs(cam.k-cam.tk)<.002) cam.mode='free';
  }else{
    if(!pinch){
      sp(cam,'k','tk','vk',dt,150,19);           // 확대는 늘 탄성
      if(anchor && now-anchorT<520){             // 커서 지점 고정
        cam.x = anchor[0] - (anchor[2]-viewCX())/cam.k;
        cam.y = anchor[1] - (anchor[3]-viewCY())/cam.k;
      }
    }
    if(!drag && !pinch){
      cam.x += cam.vx*dt; cam.y += cam.vy*dt;
      const f = Math.exp(-3.4*dt); cam.vx*=f; cam.vy*=f;
      // 경계에서 고무줄처럼 되돌아오기
      const padX = (W-panelW)/2/cam.k*0.72, padY = H/2/cam.k*0.72;
      const lx1=bounds.minX-padX, lx2=bounds.maxX+padX;
      const ly1=bounds.minY-padY, ly2=bounds.maxY+padY;
      if(cam.x<lx1){ cam.vx += (lx1-cam.x)*26*dt; cam.vx*=0.86; }
      if(cam.x>lx2){ cam.vx += (lx2-cam.x)*26*dt; cam.vx*=0.86; }
      if(cam.y<ly1){ cam.vy += (ly1-cam.y)*26*dt; cam.vy*=0.86; }
      if(cam.y>ly2){ cam.vy += (ly2-cam.y)*26*dt; cam.vy*=0.86; }
    }
  }
  draw(now);
  requestAnimationFrame(frame);
}
function sp(o,c,t,v,dt,k,d){
  const acc = k*(o[t]-o[c]) - d*o[v];
  o[v] += acc*dt; o[c] += o[v]*dt;
}

/* ── 그리기 ── */
function draw(now){
  ctx.clearRect(0,0,W,H);
  const g = ctx.createRadialGradient(viewCX(),viewCY()*0.8,0, viewCX(),viewCY(), Math.max(W,H)*0.86);
  g.addColorStop(0,'#FFFFFF'); g.addColorStop(.45,'#F8F8F6'); g.addColorStop(1,'#EDEDE9');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  const g2 = ctx.createLinearGradient(0,0,W,H);
  g2.addColorStop(0,'rgba(224,228,236,.55)'); g2.addColorStop(.5,'rgba(255,255,255,0)');
  g2.addColorStop(1,'rgba(232,226,216,.5)');
  ctx.fillStyle=g2; ctx.fillRect(0,0,W,H);

  const near = new Set();
  if(sel){ near.add(sel); sel.nb.forEach(n=>near.add(n)); }
  const K = cam.k;
  const pulse = RM ? 1 : 0.85 + Math.sin(now/620)*0.15;

  // 연결선
  const beads=[];
  ctx.lineCap='round';
  for(const L of links){
    L._bx = null;
    if(L.s===L.t) continue;
    if(!on[L.kind]) continue;
    const [x1,y1]=toScreen(L.s), [x2,y2]=toScreen(L.t);
    if((x1<-80&&x2<-80)||(x1>W+80&&x2>W+80)||(y1<-80&&y2<-80)||(y1>H+80&&y2>H+80)) continue;
    const lit = sel && (L.s===sel||L.t===sel);
    const dim = (sel && !lit) || (query && !(matches.has(L.s)||matches.has(L.t)));
    const c = KIND[L.kind].c;
    const mx=(x1+x2)/2, my=(y1+y2)/2;
    const nx=-(y2-y1), ny=(x2-x1), nl=Math.hypot(nx,ny)||1;
    const bow = (18 + L.off) * K * 0.5;
    const cxp = mx + nx/nl*bow, cyp = my + ny/nl*bow;
    const dash = KIND[L.kind].dash;
    ctx.setLineDash(dash.length ? dash.map(v=>v*Math.max(.8,Math.min(2,K))) : []);
    if(lit){
      const grad = ctx.createLinearGradient(x1,y1,x2,y2);
      grad.addColorStop(0,'rgba(20,20,20,0.10)');
      grad.addColorStop(1,'rgba(20,20,20,0.78)');
      ctx.strokeStyle=grad; ctx.lineWidth=Math.max(1.1, 1.6*K);
    }else{
      ctx.strokeStyle='rgba(20,20,20,'+(dim?0.045:0.15)+')';
      ctx.lineWidth=Math.max(.5, 0.8*K);
    }
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.quadraticCurveTo(cxp,cyp,x2,y2); ctx.stroke();
    ctx.setLineDash([]);
    if(L.fame && !dim && K>0.42){
      L._bx = 0.25*x1 + 0.5*cxp + 0.25*x2;
      L._by = 0.25*y1 + 0.5*cyp + 0.25*y2;
      beads.push(L);
    } else { L._bx = null; }
  }
  for(const L of beads){
    const lit = sel && (L.s===sel||L.t===sel);
    const rr = (lit?4.6:3.2) * (0.94+0.06*pulse);
    ctx.beginPath(); ctx.arc(L._bx,L._by, rr, 0, 7);
    ctx.fillStyle = 'rgba(255,255,255,.92)'; ctx.fill();
    ctx.lineWidth = L===hovBead ? 2.2 : 1.3;
    ctx.strokeStyle = 'rgba(20,20,20,'+(lit||L===hovBead?0.9:0.42)+')';
    ctx.stroke();
    if(L===hovBead){ ctx.beginPath(); ctx.arc(L._bx,L._by, rr-2.4, 0, 7);
      ctx.fillStyle='rgba(20,20,20,.9)'; ctx.fill(); }
  }

  // 점
  for(const n of nodes){
    const [x,y]=toScreen(n);
    const r = Math.max(2.2, n.r*K);
    if(x<-60||x>W+60||y<-60||y>H+60) continue;
    const isSel = n===sel, isNear = near.has(n), isHov = n===hov;
    const isMatch = query ? matches.has(n) : true;
    let dim = (sel && !isNear) || !isMatch;
    let c=[236,231,219];
    const top = ['memorial','homage'].find(k=>n.k[k] > n.k.dedication);
    if(top) c = KIND[top].c;
    else if(n.k.dedication) c = KIND.dedication.c;

    if(isSel || (query && isMatch)){
      ctx.beginPath();
      ctx.arc(x,y, r + (isSel? 13*pulse : 9), 0, 7);
      ctx.fillStyle='rgba(20,20,20,'+(isSel?0.08:0.055)+')';
      ctx.fill();
    }
    const im = IMG.get(n.id);
    const notable = PORTRAIT_SET.has(n.id);
    const showFace = im && im!=='no' && im.ready && (r>=7 || isSel || isHov);
    const showCrest = !showFace && notable && (r>=11 || isSel || isHov);
    if(showCrest){
      const R = Math.max(r, isSel?26:isHov?21:r);
      const gg = ctx.createLinearGradient(x-R,y-R,x+R,y+R);
      gg.addColorStop(0,'rgba(255,255,255,'+(dim?.4:.95)+')');
      gg.addColorStop(1,'rgba(232,232,228,'+(dim?.3:.9)+')');
      ctx.beginPath(); ctx.arc(x,y,R,0,7); ctx.fillStyle=gg; ctx.fill();
      ctx.lineWidth=isSel?1.8:1;
      ctx.strokeStyle='rgba(20,20,20,'+(dim?.12:.5)+')'; ctx.stroke();
      ctx.font='800 '+Math.round(R*0.92)+'px "Nanum Myeongjo",serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillStyle='rgba(20,20,20,'+(dim?.2:.86)+')';
      ctx.fillText(n.ko.trim().slice(-2,-1)||n.ko[0], x, y+R*0.04);
    } else if(showFace){
      const R = Math.max(r, isSel?26:isHov?20:r);
      ctx.save();
      ctx.beginPath(); ctx.arc(x,y,R,0,7); ctx.closePath(); ctx.clip();
      const sw=im.naturalWidth, sh=im.naturalHeight, side=Math.min(sw,sh);
      ctx.globalAlpha = dim?0.25:1;
      ctx.filter = 'grayscale(1) contrast(1.04) brightness(1.03)';
      ctx.drawImage(im,(sw-side)/2,(sh-side)*0.12,side,side, x-R,y-R,R*2,R*2);
      ctx.filter = 'none';
      ctx.globalAlpha = 1;
      ctx.restore();
      ctx.beginPath(); ctx.arc(x,y,R,0,7);
      ctx.lineWidth = isSel?2.4:1.6;
      ctx.strokeStyle = dim ? 'rgba(20,20,20,.12)'
        : (isSel||isHov) ? 'rgba(20,20,20,.9)' : 'rgba(20,20,20,.35)';
      ctx.stroke();
    }else{
      ctx.beginPath(); ctx.arc(x,y,r,0,7);
      ctx.fillStyle = dim
        ? 'rgba('+c[0]+','+c[1]+','+c[2]+',0.20)'
        : 'rgba('+c[0]+','+c[1]+','+c[2]+','+(isSel?1:isNear?0.92:0.78)+')';
      ctx.fill();
      if(isSel||isHov){ ctx.lineWidth=1.6; ctx.strokeStyle='rgba(20,20,20,.92)'; ctx.stroke(); }
    }

    // 이름
    const show = isSel || isHov || (query&&isMatch) || (isNear && K>0.55) || (!sel && (n.inD>=7 || K>1.45)) ;
    if(show && !dim){
      const face = (showFace||showCrest);
      const R2 = face ? Math.max(r, isSel?26:isHov?21:r) : r;
      const fs = Math.max(10.5, Math.min(16, 10 + n.inD*0.22 + (isSel?3.5:0)));
      ctx.font = (isSel?'700 ':'500 ')+fs+'px "Pretendard Variable",Pretendard,sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      const ty = y + R2 + fs*0.92;
      ctx.lineWidth=3.6; ctx.strokeStyle='rgba(250,250,248,.92)';
      ctx.strokeText(n.short, x, ty);
      ctx.fillStyle = isSel? 'rgba(20,20,20,1)' : 'rgba(20,20,20,'+(isNear||isHov?0.82:0.5)+')';
      ctx.fillText(n.short, x, ty);
    }
  }
}

/* ── 시작 ── */
addEventListener('resize', ()=>{ resize(); });
resize();
function openingView(){
  measure();
  const k = Math.max(0.9, Math.min(1.5, fitScale()*1.75));
  cam.x = hub.x; cam.y = hub.y;
  cam.k = RM ? k : k*0.55;
  flyTo(hub.x, hub.y, k);
}
openingView();
document.getElementById('reset').onclick=()=>{ select(null); setTimeout(openingView,20); };
cv.style.cursor='grab';
requestAnimationFrame(frame);
})();
</script>
